[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit NeoPixel@^1.12.0
build_flags =
    ; Serial on UART0, i.e. the port marked "UART"/"COM" on the DevKitC-1
    -DARDUINO_USB_CDC_ON_BOOT=0

; Static LED test without BLE: python -m platformio run -e ledtest -t upload --upload-port COM7
[env:ledtest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DLED_TEST
